services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pricepilot
      POSTGRES_USER: pricepilot
      POSTGRES_PASSWORD: pricepilot
    ports:
      - "5432:5432"
    volumes:
      - pricepilot-postgres:/var/lib/postgresql/data

volumes:
  pricepilot-postgres:
